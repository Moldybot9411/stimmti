services:
  # MySQL
  db:
    image: mysql:8.0
    container_name: stimmti_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: StimmtiDB
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: stimmti_phpmyadmin
    restart: always
    links:
      - db
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_ARBITRARY: 1

volumes:
  mysql_data:
